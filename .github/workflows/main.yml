# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build pyinstaller executable

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/main.yml"
      - "yt_dvr.spec"
  release:
    types: [published]

jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2

      - name: Download ffmpeg and deno
        run: |
          Invoke-WebRequest -Uri https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          Move-Item ffmpeg-n9.0-latest-win64-gpl-shared-9.0\bin build
          dir build
          Invoke-WebRequest -Uri https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath build

      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12'
          spec: 'yt_dvr.spec'
          upload_exe_with_name: 'yt-dvr'
      
      - name: Upload release
        if: ${{ github.event_name == 'release' }}
        uses: shogo82148/actions-upload-release-asset@v1.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ github.workspace }}\dist\yt-dvr.exe
          asset_name: yt-dvr.exe
          asset_content_type: application/vnd.microsoft.portable-executable
